name: CI/CD Pipeline

# 1. Define when this pipeline should run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_environment:
        description: 'Target Environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      browser:
        description: 'Browser for Testing'
        required: false
        default: 'electron'
        type: choice
        options:
          - electron
          - chrome
          - firefox
          - edge
      spec_path:
        description: 'Test Suite File'
        required: true
        default: 'cypress/e2e/authentication/tc_01_login_to_orangehrm.cy.js'
        type: choice
        options:
          - cypress/e2e/authentication/tc_01_login_to_orangehrm.cy.js
          - cypress/e2e/authentication/tc_02_login.cy.js
          - cypress/e2e/tax_invoice/tc_01_create_invoice.cy.js
          - cypress/e2e/tax_invoice/tc_02_submit_invoice.cy.js
          - cypress/e2e/user_management/tc_01_add_user.cy.js

# 2. Define the automation tasks
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.event.inputs.test_environment || 'staging' }}
      SPEC_PATH: ${{ github.event.inputs.spec_path || 'cypress/e2e/**/*.cy.js' }}
      BROWSER: ${{ github.event.inputs.browser || 'electron' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show selected config
        run: echo "Running $SPEC_PATH on $TARGET_ENV and using $BROWSER"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx cypress run --browser electron --spec "$SPEC_PATH"
      
      # - name: Merge Mochawesome Reports
      #   if: always()
      #   run: |
      #     npx mochawesome-merge 'cypress/reports/mochawesome*.json' -o cypress/reports/mochawesome.json

      # - name: Generate HTML Reports
      #   if: always()
      #   run: |
      #     npx mochawesome-report-generator cypress/reports/mochawesome.json -o cypress/reports

      - name: Upload Test Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports
          path: cypress/reports/
          retention-days: 5

      - name: HTML Preview
        id: html_preview
        uses: pavi2410/html-preview-action@v5
        with:
          html_file: mochawesome.html
          site_root: cypress/reports/
          upload: auto
          job_summary: false
      
      # - name: Comment PR with Report Link
      #   if: always() && github.event_name == 'pull_request'
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       github.rest.issues.createComment({
      #         issue_number: context.issue.number,
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         body: '📊 Test Report: Check the artifacts for detailed Cypress test reports'
      #       })

      - name: Telegram Notification
        if: always()
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          PROJECT=$(basename "$GITHUB_REPOSITORY")
          BRANCH="${GITHUB_REF#refs/heads/}"
          COMMIT="${GITHUB_SHA}"
          MESSAGE="GitHub Actions Pipeline Completed\n\nProject: $PROJECT\nBranch: $BRANCH\nCommit: $COMMIT\nWorkflow: ${{ github.workflow }}\nStatus: $STATUS\nPath: $SPEC_PATH"
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="$(printf '%b' "$MESSAGE")")
        #echo "Telegram response: $RESPONSE"

      - name: Deploy Application
        if: github.ref == 'refs/heads/main'
        run: echo "Deploying application..."
